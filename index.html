<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Richie Richardo – Professional Portfolio</title>
    <meta
      name="description"
      content="Richie Richardo's one-page portfolio. Frontend developer specializing in React and Tailwind. Projects, skills, and a contact form to request my CV."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- Favicon (per requirements: /assets/favicon.ico) -->
    <link rel="icon" href="/assets/favicon.ico" />
    <meta name="theme-color" content="#0B0F0E" />

    <!-- Open Graph -->
    <meta property="og:title" content="Richie Richardo – Frontend Developer" />
    <meta
      property="og:description"
      content="Fast, accessible React + Tailwind projects, skills, and contact to request my CV."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Richie Richardo – Frontend Developer" />
    <meta
      name="twitter:description"
      content="Fast, accessible React + Tailwind projects, skills, and contact to request my CV."
    />
    <meta name="twitter:image" content="https://example.com/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Richie Richardo",
        "jobTitle": "Frontend Developer",
        "url": "https://example.com/",
        "sameAs": [
          "https://github.com/richierichardo",
          "http://www.linkedin.com/in/richie-richardo21"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  
</html>
