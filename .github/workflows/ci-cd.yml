name: Riporto CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: read


concurrency:
  group: riport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: riporto-dist
          path: dist/
          retention-days: 7

  deploy:
    needs: build-test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.result == 'success'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: riporto-dist
          path: dist

      - name: Upload to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "dist/*"
          target: "/var/www/apps/porto"
          overwrite: true